- name: Frontend Setup
  hosts: all
  become: true
  tasks:
    - name: Install Nginx
      ansible.builtin.dnf:
        name: nginx
        state: installed

    - name: Copying nginx configuration
      ansible.builtin.copy:
        src: nginx.conf
        dest: /etc/nginx/nginx.conf

    - name: Configuring NodeJs repos
      ansible.builtin.shell: curl -sL https://rpm.nodesource.com/setup_20.x | bash

    - name: Install NodeJS
      ansible.builtin.dnf:
        name: nodeJS
        state: installed

    - name: Cleanup a temp folder that downloaded app code
      ansible.builtin.file:
        path: /tmp/frontend
        state: absent

    - name: Create a temp folder to download app code
      ansible.builtin.file:
        path: /tmp/frontend
        state: directory

    - name: Download app code
      ansible.builtin.unarchive:
        ser: https://raw.githubusercontent.com/raghudevopsb89/roboshop-microservices/main/artifacts/frontend.zip
        remote_src: yes
        dest: /tmp/frontend

    - name: Compile code
      ansible.builtin.shell: |
        npm install
        npm run build
        
#    - name: Cleanup default http content
#      ansible.buildin.file:
#        path: /usr/share/nginx/html
#        state: absent

    - name: Copying frontend compiled code
      ansible.builtin.copy:
        path: /tmp/fronted/out/
        dest: /usr/share/nginx/html

    - name: Start the Nginx service
      ansible.builtin.systemd_service:
        name: nginx
        state: restarted
        enable: yes





